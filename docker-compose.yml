# PostgreSQL 16 + PostGIS for AquaRoute segment geometry & spatial queries.
# Usage: `make up` (or `docker compose up -d`).
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aquaroute-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquaroute}
      POSTGRES_DB: ${POSTGRES_DB:-aquaroute}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aquaroute_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaroute} -d ${POSTGRES_DB:-aquaroute}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aquaroute_pgdata:
